<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#0d1a14"/>
<title>Open Shelf — a public reading room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Karla:ital,wght@0,300..800;1,300..800&family=Spline+Sans+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1a14; --ink2:#13241b; --panel:#182e22;
  --paper:#f3ecdc; --paper-dim:#e7dcc4;
  --text:#efe7d3; --muted:#a9b8a5; --sage:#7fa08c;
  --gold:#d9a441; --vermilion:#e0492f;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:'Karla',system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 620px at 12% -5%, rgba(217,164,65,.15), transparent 60%),
  radial-gradient(820px 700px at 102% 18%, rgba(127,160,140,.11), transparent 55%),
  radial-gradient(760px 540px at 68% 104%, rgba(224,73,47,.09), transparent 60%),
  var(--ink);}
.grain{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>");}
::selection{background:var(--vermilion);color:#fff}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
a{color:var(--gold)}
main{min-height:72vh}

.masthead{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:13px clamp(16px,4vw,44px);background:rgba(13,26,20,.93);border-bottom:1px solid rgba(217,164,65,.24)}
.wordmark{font-family:'Fraunces',serif;font-weight:800;font-style:italic;font-size:23px;color:var(--paper);text-decoration:none}
.wordmark span{color:var(--gold);font-style:normal;margin-left:4px}
.mast-right{display:flex;align-items:center;gap:18px}
.mast-date{font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

#ticker{display:none;overflow:hidden;border-bottom:1px solid rgba(217,164,65,.16);background:rgba(19,36,27,.55);padding:8px 0}
body[data-route="home"] #ticker{display:block}
.ticker-track{display:inline-flex;align-items:center;gap:26px;white-space:nowrap;
  font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);
  animation:tick 80s linear infinite}
.ticker-track i{font-style:normal;color:rgba(217,164,65,.45)}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}

.btn{display:inline-flex;align-items:center;gap:10px;font-family:'Karla';font-weight:800;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;text-decoration:none;border-radius:3px;padding:13px 18px;border:none;cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, background .18s}
.btn-search{background:var(--vermilion);color:#fff6ec;box-shadow:0 2px 0 #7c2413}
.btn-search:hover{transform:translateY(-2px);box-shadow:0 4px 0 #7c2413}
.btn-read{background:var(--vermilion);color:#fff6ec;font-size:15px;padding:16px 26px;box-shadow:0 3px 0 #7c2413}
.btn-read span{transition:transform .2s}
.btn-read:hover{transform:translateY(-2px);box-shadow:0 5px 0 #7c2413}
.btn-read:hover span{transform:translateX(5px)}
.btn-read[aria-disabled="true"]{background:#4b3a33;box-shadow:0 3px 0 #2c211d;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid rgba(217,164,65,.45);color:var(--gold)}
.btn-ghost:hover{background:rgba(217,164,65,.12);transform:translateY(-2px)}

.home{max-width:1240px;margin:0 auto;padding:clamp(28px,5vw,60px) clamp(16px,4vw,44px) 30px}
.home-top{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(230px,.55fr);gap:34px;align-items:end;
  padding-bottom:clamp(24px,4vw,44px);border-bottom:2px solid rgba(217,164,65,.3)}
.home-kicker{font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:.26em;color:var(--gold);margin-bottom:16px}
.home-h{font-family:'Fraunces',serif;font-weight:620;font-size:clamp(31px,4.6vw,58px);line-height:1.05;color:var(--paper)}
.home-h em{font-style:italic;color:var(--gold)}
.home-lede{margin-top:16px;color:var(--muted);font-size:16px;max-width:56ch}
.stats{display:grid;gap:14px;justify-items:end;text-align:right}
.stat b{font-family:'Fraunces',serif;font-size:27px;color:var(--paper);font-weight:700;display:block;line-height:1.1}
.stat span{font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}

.shelf{padding:clamp(24px,3vw,40px) 0 8px;border-bottom:1px dashed rgba(217,164,65,.16)}
.shelf-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}
.shelf-kicker{font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:.26em;color:var(--gold);margin-bottom:8px}
.shelf-name{font-family:'Fraunces',serif;font-size:clamp(24px,2.6vw,34px);font-weight:640;color:var(--paper)}
.shelf-sub{color:var(--muted);font-size:14px;margin-top:6px;max-width:52ch}
.shelf-nav{display:flex;gap:8px;flex:none}
.nav-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(217,164,65,.4);background:transparent;color:var(--gold);
  font-size:17px;cursor:pointer;transition:.2s}
.nav-btn:hover{background:var(--gold);color:var(--ink);transform:scale(1.08)}
.row{display:flex;gap:clamp(14px,1.6vw,22px);overflow-x:auto;padding:6px 4px 24px;scroll-snap-type:x proximity;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent)}
.row::-webkit-scrollbar{display:none}
.shelf-err{color:var(--muted);font-style:italic;padding:12px 4px}

.card{flex:0 0 158px;scroll-snap-align:start;background:none;border:none;padding:0;cursor:pointer;text-align:left;
  font-family:inherit;color:inherit;transition:transform .3s cubic-bezier(.2,.7,.3,1.25)}
.card:hover{transform:translateY(-9px) rotate(-1.3deg)}
.cover{position:relative;display:block;aspect-ratio:5/7;border-radius:2px 6px 6px 2px;overflow:hidden;background:var(--panel);
  box-shadow:6px 8px 22px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.05);transition:box-shadow .3s}
.card:hover .cover{box-shadow:12px 18px 34px rgba(0,0,0,.55)}
.cover::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,.13),transparent 24%),linear-gradient(90deg,rgba(0,0,0,.34),transparent 8%)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transition:transform .45s ease,filter .3s}
.card:hover .cover img{transform:scale(1.05);filter:saturate(1.12)}
.plate{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:14px;background:linear-gradient(160deg,var(--paper-dim),#c9b98f);color:#3b2f1e;text-align:center}
.plate b{font-family:'Fraunces',serif;font-size:42px;font-weight:800}
.plate small{font-family:'Fraunces',serif;font-style:italic;font-size:11px;line-height:1.35;max-width:100%;overflow:hidden}
.card-flag{position:absolute;right:6px;bottom:6px;z-index:3;font-family:'Spline Sans Mono',monospace;font-size:8px;
  letter-spacing:.2em;color:var(--ink);background:var(--gold);padding:3px 6px;border-radius:2px}
.card-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:12px;
  font-family:'Fraunces',serif;font-weight:640;font-size:14.5px;line-height:1.3;color:var(--paper)}
.card-a{display:block;margin-top:5px;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--sage)}

.skel-card{flex:0 0 158px}
.skel-cover{aspect-ratio:5/7;border-radius:4px;background:linear-gradient(100deg,#1b3126 40%,#264433 50%,#1b3126 60%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
.skel-line{height:12px;margin-top:12px;border-radius:2px;width:88%;
  background:linear-gradient(100deg,#1b3126 40%,#264433 50%,#1b3126 60%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .65s ease,transform .65s ease}
.reveal.in{opacity:1;transform:none}

.detail{max-width:1120px;margin:0 auto;padding:clamp(26px,4vw,52px) clamp(16px,4vw,44px) 80px}
.backlink{display:inline-block;font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);text-decoration:none;margin-bottom:28px;transition:.2s}
.backlink:hover{color:var(--paper);transform:translateX(-4px)}
.detail-grid{display:grid;grid-template-columns:minmax(240px,330px) 1fr;gap:clamp(28px,5vw,64px);align-items:start}
.detail-cover{margin:0;transform:rotate(-2deg);transition:transform .35s ease}
.detail-cover:hover{transform:rotate(0)}
.detail-cover .cover{aspect-ratio:5/7;box-shadow:16px 20px 48px rgba(0,0,0,.5)}
.detail-cover figcaption{margin-top:14px;text-align:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:.24em;color:var(--muted)}
.kicker{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.detail-info h1{font-family:'Fraunces',serif;font-weight:640;font-size:clamp(30px,4.4vw,52px);line-height:1.06;color:var(--paper)}
.byline{margin-top:12px;font-size:16px;color:var(--muted)}
.byline em{font-family:'Fraunces',serif;font-style:italic;color:var(--paper);font-size:19px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.meta{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:6px 10px;border:1px solid rgba(169,184,165,.35);border-radius:2px;color:var(--muted)}
.meta-good{border-color:rgba(217,164,65,.6);color:var(--gold)}
.meta-bad{border-color:rgba(224,73,47,.5);color:#e08a77}
.chip{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.12em;padding:6px 10px;border-radius:2px;text-transform:uppercase;
  background:rgba(217,164,65,.13);color:var(--gold);border:1px solid rgba(217,164,65,.4)}
.desc{margin:14px 0 26px}
.desc-text{position:relative;font-size:16.5px;line-height:1.75;color:#d9d4c3;max-width:64ch}
.desc-text.clamped{max-height:132px;overflow:hidden}
.desc-text.clamped::after{content:'';position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--ink))}
.desc-toggle{background:none;border:none;color:var(--gold);font-family:'Spline Sans Mono',monospace;font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:10px 0 0}
.desc-toggle:hover{color:var(--paper)}
.desc-src{margin-top:10px;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.detail-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.subjects{margin-top:34px}
.subjects h4{font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.subjects ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}
.subjects li{font-size:12.5px;color:var(--sage);border:1px dashed rgba(127,160,140,.45);padding:5px 11px;border-radius:999px;transition:.2s}
.subjects li:hover{border-style:solid;color:var(--paper)}

/* ---------- reader ---------- */
body[data-route="read"] .masthead{display:none}
.reader{max-width:1100px;margin:0 auto;padding:0 clamp(12px,3vw,32px) 90px}
.reader-bar{position:sticky;top:0;z-index:45;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:rgba(13,26,20,.96);
  border-bottom:1px solid rgba(217,164,65,.22);padding:12px 6px}
.reader-bar .backlink{margin:0}
.reader-title{flex:1;min-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Fraunces',serif;
  font-style:italic;font-size:15px;color:var(--paper-dim)}
.reader-title i{font-style:normal;color:var(--gold)}
.reader-tools{display:flex;gap:6px;align-items:center}
.tool-btn{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--gold);background:transparent;
  border:1px solid rgba(217,164,65,.4);border-radius:2px;padding:7px 10px;cursor:pointer;text-decoration:none;transition:.2s}
.tool-btn:hover{background:var(--gold);color:var(--ink)}
.seg{display:inline-flex;border:1px solid rgba(217,164,65,.45);border-radius:999px;overflow:hidden}
.seg button{font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:8px 14px;background:transparent;border:none;color:var(--gold);cursor:pointer;transition:.2s}
.seg button.on{background:var(--gold);color:var(--ink);font-weight:700}
.reader-note{margin-top:14px;font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.reader-frame{width:100%;height:calc(100vh - 150px);min-height:480px;border:none;border-radius:6px;background:var(--panel);
  box-shadow:0 26px 64px rgba(0,0,0,.5);margin-top:22px}
.reader-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:80;background:rgba(217,164,65,.12)}
#prog{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--vermilion));transition:width .12s linear}
.rd-body{margin-top:30px;background:var(--paper);color:#241c12;border-radius:4px;
  padding:clamp(28px,6vw,72px) clamp(22px,7vw,84px);box-shadow:0 26px 64px rgba(0,0,0,.5);
  font-family:'Fraunces',serif;font-weight:400;font-size:var(--fs,19px);line-height:1.85;hyphens:auto;max-width:880px;margin-left:auto;margin-right:auto}
.rd-body p{margin:0 0 1.1em}
.rd-body>p:first-of-type::first-letter{font-size:3.3em;font-weight:700;float:left;line-height:.85;padding:5px 10px 0 0;color:var(--vermilion)}
.rd-h{font-family:'Karla';font-weight:800;font-size:.68em;letter-spacing:.3em;text-transform:uppercase;color:#7a4a17;
  margin:2.1em 0 1.1em;padding-top:1.1em;border-top:1px solid rgba(122,74,23,.3)}
.rd-verse{padding-left:1.2em;color:#3d3020;font-style:italic}
.rd-loading{display:flex;flex-direction:column;align-items:center;gap:18px;padding:70px 0;color:#7a6a4d;
  font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.rd-error{margin-top:30px;background:var(--paper);color:#241c12;border-radius:4px;padding:clamp(26px,5vw,52px);
  box-shadow:0 20px 50px rgba(0,0,0,.45);max-width:880px;margin-left:auto;margin-right:auto}
.rd-error h3{font-family:'Fraunces',serif;font-size:26px;margin-bottom:12px}
.rd-error p{color:#5a4c36;margin-bottom:22px;max-width:56ch}

.search{max-width:900px;margin:0 auto;padding:clamp(36px,6vw,72px) clamp(16px,4vw,44px) 80px}
.search-h{font-family:'Fraunces',serif;font-style:italic;font-weight:620;font-size:clamp(34px,5vw,58px);color:var(--paper);margin:8px 0 32px}
.search-box{display:flex;align-items:center;gap:16px;border-bottom:2px solid rgba(217,164,65,.5);padding:4px 2px 16px;transition:border-color .2s}
.search-box:focus-within{border-color:var(--vermilion)}
.search-ico{font-size:26px;color:var(--gold)}
#q{flex:1;background:none;border:none;outline:none;color:var(--paper);font-family:'Fraunces',serif;
  font-size:clamp(20px,3vw,29px);caret-color:var(--vermilion)}
#q::placeholder{color:rgba(239,231,211,.28);font-style:italic}
.search-hint{margin:18px 0 4px;font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.res-list{list-style:none;padding:0;margin:14px 0 0}
.res-item{display:grid;grid-template-columns:52px 1fr auto auto;gap:18px;align-items:center;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px dashed rgba(217,164,65,.18);padding:15px 6px;cursor:pointer;color:inherit;
  font-family:inherit;transition:background .2s,transform .25s}
.res-item:hover{background:rgba(217,164,65,.07);transform:translateX(7px)}
.res-cover{position:relative;width:52px;height:72px;border-radius:2px;overflow:hidden;background:var(--panel);box-shadow:3px 4px 10px rgba(0,0,0,.4)}
.res-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini-plate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--paper-dim),#c9b98f);color:#3b2f1e;font-family:'Fraunces',serif;font-weight:700}
.res-title{display:block;font-family:'Fraunces',serif;font-weight:640;font-size:18px;color:var(--paper);line-height:1.25}
.res-author{display:block;margin-top:4px;font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage)}
.res-shelf{font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--gold);
  border:1px solid rgba(217,164,65,.35);padding:4px 8px;border-radius:2px;text-transform:uppercase;max-width:180px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-dl{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.empty{margin-top:34px;padding:34px;border:1px dashed rgba(217,164,65,.3);border-radius:4px}
.empty-h{font-family:'Fraunces',serif;font-style:italic;font-size:24px;color:var(--paper);margin-bottom:8px}
.empty-p{color:var(--muted)}
.res-loading{display:flex;justify-content:center;padding:50px 0}
.more-wrap{margin-top:24px}

.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(217,164,65,.25);border-top-color:var(--gold);animation:spin .8s linear infinite}
.spinner.sm{width:16px;height:16px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.load-screen{display:flex;flex-direction:column;align-items:center;gap:20px;padding:120px 20px;color:var(--muted);
  font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.load-screen .big{font-family:'Fraunces',serif;font-size:32px;color:var(--paper);text-transform:none;letter-spacing:0;font-style:italic}
.foot{border-top:1px solid rgba(217,164,65,.18);margin-top:40px;padding:26px clamp(16px,4vw,44px);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.foot a{color:var(--gold);text-decoration:none}
.foot a:hover{text-decoration:underline}

@media(max-width:860px){
  .home-top{grid-template-columns:1fr}
  .stats{display:flex;justify-items:start;text-align:left;gap:26px}
  .detail-grid{grid-template-columns:1fr}
  .detail-cover{max-width:280px}
  .res-item{grid-template-columns:44px 1fr auto}
  .res-shelf{display:none}
  .mast-date{display:none}
}
</style>
</head>
<body data-route="home">
<div class="grain" aria-hidden="true"></div>

<header class="masthead">
  <a class="wordmark" href="#/">Open Shelf<span>❧</span></a>
  <div class="mast-right">
    <span class="mast-date" id="mastDate"></span>
    <a class="btn btn-search" href="#/search">Search the stacks <span aria-hidden="true">⌕</span></a>
  </div>
</header>

<div id="ticker" aria-hidden="true"><div class="ticker-track" id="tickerTrack"></div></div>

<main id="view"></main>

<footer class="foot">
  <span>Open Shelf · catalogue &amp; covers: <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a> · scans &amp; pages: <a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a></span>
  <span>Built for late-night readers ❦</span>
</footer>

<script>
/* ================================================================
   TUNING KNOBS
   ================================================================ */
const BOOKS_PER_SHELF     = 5;      // 👈 cards rendered per shelf (try 1–7)
const FETCH_PER_SHELF     = 24;     // candidates pulled from Open Library per shelf
const SEARCH_FETCH_LIMIT  = 30;     // results requested per search call
const SEARCH_RENDER_LIMIT = 12;     // rows shown before "Show more"
const CACHE_MINUTES       = 60;     // Open Library responses cached this long
const LAZY_MARGIN_PX      = 700;    // shelf fetches when this close to viewport

const TTL = CACHE_MINUTES * 60 * 1000;
const $ = s => document.querySelector(s);

const textCache = new Map();    // ia -> OCR text

let lastSearch = null;
let searchAbort = null;
let progHandler = null;

  {id:'trending', tag:'OPEN LIBRARY · TRENDING DAILY', name:'Trending today',        sub:'The most-wanted books on Open Library right now.',              type:'trending'},
  {id:'fiction',  tag:'SUBJECT · FICTION',             name:'Classic Fiction',       sub:'The canon — spine-broken, dog-eared and beloved.',              slug:'fiction'},
  {id:'humor',    tag:'SUBJECT · HUMOR',               name:'Comedy & Humour',       sub:'Wit, farce and excellent nonsense.',                            slug:'humor'},
  {id:'scifi',    tag:'SUBJECT · SCIENCE FICTION',     name:'Science Fiction',       sub:'Rocketships from long before rockets existed.',                 slug:'science_fiction'},
  {id:'adventure',tag:'SUBJECT · ADVENTURE',           name:'Adventure & Sea Tales', sub:'High seas, lost worlds and suspiciously thin maps.',            slug:'adventure'},
  {id:'mystery',  tag:'SUBJECT · MYSTERY',             name:'Mystery & Crime',       sub:'Drawing-room murders and fog-bound streets.',                   slug:'mystery'},
  {id:'fairy',    tag:'SUBJECT · FAIRY TALES',         name:'Children\u2019s Corner',sub:'Fairy tales, fables and talking rabbits.',                      slug:'fairy_tales'},
  {id:'poetry',   tag:'SUBJECT · POETRY',              name:'Verse & Poetry',        sub:'Sonnets, epics and loose leaves.',                              slug:'poetry'},
  {id:'ideas',    tag:'SUBJECT · PHILOSOPHY',          name:'Non-Fiction · Ideas',   sub:'Philosophy, essays and stubborn opinions.',                     slug:'philosophy'},
];

/* ================= helpers ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normKey = k => String(k || '').replace(/^\/works\//, '');
const coverUrl = (id, size) => id ? `https://covers.openlibrary.org/b/id/${id}-${size}.jpg` : '';
const initialOf = t => (t || '?').trim().charAt(0).toUpperCase();
const iaOf = w => (w.ia && w.ia[0]) || '';
const olPage = w => `https://openlibrary.org/works/${w.id}`;
const iaPage = w => iaOf(w) ? `https://archive.org/details/${iaOf(w)}` : '';

function fromSubject(w){ return {
  id: normKey(w.key), title: w.title || 'Untitled',
  authors: (w.authors || []).map(a => a.name).filter(Boolean),
  year: w.first_publish_year || null, cover: w.cover_id || null,
  ia: Array.isArray(w.ia) ? w.ia : (w.ia ? [w.ia] : []),
  subjects: (w.subject || []).slice(0, 6)
};}
function fromSearch(w){ return {
  id: normKey(w.key), title: w.title || 'Untitled',
  authors: w.author_name || [],
  year: w.first_publish_year || null, cover: w.cover_i || null,
  ia: Array.isArray(w.ia) ? w.ia : (w.ia ? [w.ia] : []),
  subjects: (w.subject || []).slice(0, 6)
};}
function fromTrending(w){ return {
  id: normKey(w.key), title: w.title || 'Untitled',
  authors: [typeof w.author === 'string' ? w.author : (w.author && w.author.name) || ''].filter(Boolean),
  year: null, cover: (w.covers && w.covers[0]) || w.cover_id || null,
  ia: Array.isArray(w.ia) ? w.ia : (w.ia ? [w.ia] : []),
  subjects: (w.subject || []).slice(0, 6)
};}

/* ---- cached Open Library fetch ---- */
async function olCached(url, build, signal){
  const key = 'ol:' + url;
  try{
    const raw = localStorage.getItem(key);
    if(raw){
      const p = JSON.parse(raw);
      if(Date.now() - p.t < TTL){ console.info('[Open Shelf] cache hit:', url); return p; }
    }
  }catch(e){}
  const json = await (await fetch(url, {signal})).json();   // AbortError propagates
  const p = Object.assign({t: Date.now()}, build(json));
  try{ localStorage.setItem(key, JSON.stringify(p)); }
  catch(e){
    try{
      const now = Date.now();
      for(let i = localStorage.length - 1; i >= 0; i--){
        const k = localStorage.key(i);
        if(k && k.startsWith('ol:')){
          try{ const v = JSON.parse(localStorage.getItem(k)); if(!v.t || now - v.t > TTL) localStorage.removeItem(k); }
          catch(_){ localStorage.removeItem(k); }
        }
      }
      localStorage.setItem(key, JSON.stringify(p));
    }catch(_){}
  }
  return p;
}

/* ---- work record: description, covers, scan id (cached) ---- */
async function workMeta(id){
  const key = 'ol:work:' + id;
  try{
    const raw = localStorage.getItem(key);
    if(raw){
      const p = JSON.parse(raw);
      if(Date.now() - p.t < TTL) return p.meta;
    }
  }catch(e){}
  const j = await (await fetch(`${OL}/works/${id}.json`)).json();
  let desc = j.description;
  if(desc && typeof desc === 'object') desc = desc.value;
  const meta = {
    title: j.title || 'Untitled',
    desc: desc || null,
    covers: j.covers || [],
    subjects: (j.subjects || []).slice(0, 10),
    ocaid: j.ocaid || null,
    authorKeys: (j.authors || []).map(a => (a.author && a.author.key) || a.key).filter(Boolean)
  };
  try{ localStorage.setItem(key, JSON.stringify({t: Date.now(), meta})); }catch(e){}
  return meta;
}
async function authorName(akey){
  try{
    const a = await (await fetch(`${OL}${akey}.json`)).json();
    return a.name || null;
  }catch(e){ return null; }
}

function renderHome(){

      </div>

        <div class="stat"><b>2</b><span>reading modes built in</span></div>

    </section>
    <div id="shelves">${SHELVES.map(shelfSkeleton).join('')}</div>
  </div>`;
  document.querySelectorAll('.shelf.reveal').forEach(el => io.observe(el));
  observeShelves();

function observeShelves(){
  const lazy = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if(!en.isIntersecting) return;
      lazy.unobserve(en.target);
      loadShelf(SHELVES[+en.target.dataset.i], +en.target.dataset.i, en.target);
    });
  }, {rootMargin: LAZY_MARGIN_PX + 'px 0px'});
  document.querySelectorAll('.shelf[data-i]').forEach(s => lazy.observe(s));
}
function pickFrom(list, N){
  const picks = [];
  const add = w => { seen.add(w.id); lib.set(w.id, w); picks.push(w); };
  for(const w of list){ if(picks.length >= N) break; if(seen.has(w.id)) continue; if(w.ia.length) add(w); } // readable first
  for(const w of list){ if(picks.length >= N) break; if(seen.has(w.id)) continue; add(w); }
  return picks;
}
async function loadShelf(sh, i, wrap){
  if(wrap.dataset.loaded) return;
  wrap.dataset.loaded = '1';
  try{
    let results;
    if(sh.type === 'trending'){
      const data = await olCached(`${OL}/trending/daily.json`,
        j => ({results: (j.works || []).map(fromTrending)}));
      results = data.results;
    }else{
      const data = await olCached(
        `${OL}/subjects/${sh.slug}.json?limit=${FETCH_PER_SHELF}&details=true`,
        j => ({results: (j.works || []).map(fromSubject)}));
      results = data.results;
    }
    const picks = pickFrom(results, BOOKS_PER_SHELF);
    wrap.innerHTML = `<header class="shelf-head">
        <div>
          <p class="shelf-kicker">SHELF 0${i} · ${sh.tag}</p>
          <h2 class="shelf-name">${sh.name}</h2>
          <p class="shelf-sub">${sh.sub}</p>
        </div>
        <div class="shelf-nav">
          <button class="nav-btn" data-scroll="-1" aria-label="Scroll shelf left">&larr;</button>
          <button class="nav-btn" data-scroll="1"  aria-label="Scroll shelf right">&rarr;</button>
        </div>
      </header>
      <div class="row">${picks.map(cardHTML).join('')}</div>`;
    wrap.querySelectorAll('[data-scroll]').forEach(btn => {
      btn.onclick = () => {
        const row = wrap.querySelector('.row');
        row.scrollBy({left: (+btn.dataset.scroll) * row.clientWidth * .8, behavior:'smooth'});
      };
    });
    if(sh.id === 'trending') buildTicker();
  }catch(e){
    wrap.innerHTML = `<p class="shelf-err">Couldn&rsquo;t reach Open Library — check your connection and reload.</p>`;
  }
}
function buildTicker(){
  const seed = ['Moby-Dick','Pride and Prejudice','Frankenstein','Dracula','Alice in Wonderland','Great Expectations','Walden','The Odyssey','Jane Eyre','Peter Pan','Don Quixote','Leaves of Grass'];
  const names = [...lib.values()].filter(w => w.title).slice(0, 14).map(w => w.title);
  const list = names.length ? names : seed;
  const seq = list.map(t => `<span>${esc(t)}</span><i>&#10022;</i>`).join('');
  $('#tickerTrack').innerHTML = seq + seq;
}

function descHTML(d, w){

function wireDescToggle(){

  t.onclick = () => {

    t.innerHTML = p.classList.contains('clamped') ? 'Read more &darr;' : 'Show less &uarr;';

/* ================= READER — Pages ⇄ Text ================= */
let fs = 19; try{ fs = +localStorage.getItem('os-fs') || 19; }catch(e){}
let rmode = 'pages'; try{ rmode = localStorage.getItem('os-rmode') || 'pages'; }catch(e){}
function persist(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }
function applyFs(){ const el = document.getElementById('rdBody'); if(el) el.style.setProperty('--fs', fs + 'px'); persist('os-fs', fs); }

function cleanOCR(t){
  let s = t.replace(/\r/g, '').replace(/\f/g, '\n\n');
  s = s.replace(/(\w)-\s*\n\s*(\w)/g, '$1$2');   // heal hyphenated line breaks
  s = s.replace(/\n{3,}/g, '\n\n');
  return s.trim();
}
function toBlocks(raw){
  return cleanOCR(raw).split(/\n\s*\n+/).map(block => {
    const lines = block.split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).filter(Boolean);
    if(!lines.length) return null;
    if(lines.length > 1 && Math.max(...lines.map(l => l.length)) < 48)
      return {type:'verse', html: lines.map(esc).join('<br>')};
    const joined = lines.join(' ');
    if(joined.length <= 64 && joined === joined.toUpperCase() && /[A-Z]{3,}/.test(joined))
      return {type:'heading', html: esc(joined)};
    return {type:'p', html: esc(joined)};
  }).filter(Boolean);
}
const blockHTML = bl => bl.type === 'heading' ? `<h3 class="rd-h">${bl.html}</h3>`
  : bl.type === 'verse' ? `<p class="rd-verse">${bl.html}</p>` : `<p>${bl.html}</p>`;

async function getText(ia){
  if(textCache.has(ia)) return textCache.get(ia);
  for(const suf of ['_djvu.txt', '_chocr.txt']){
    try{
      const r = await fetch(`https://archive.org/download/${ia}/${ia}${suf}`);
      if(r.ok){
        const t = await r.text();
        if(t.length > 2000){ textCache.set(ia, t); return t; }
      }
    }catch(e){}
  }
  return null;
}

async function renderReader(id){
  document.body.dataset.route = 'read';
  view.innerHTML = `<div class="load-screen"><div class="spinner"></div><p>Opening the book&hellip;</p></div>`;
  let w = lib.get(id);
  if(!w){
    try{
      const meta = await workMeta(id);
      if(meta){
        let name = meta.authorKeys[0] ? await authorName(meta.authorKeys[0]) : null;
        w = {id, title: meta.title, authors: name ? [name] : [], year: null,
             cover: meta.covers[0] || null, ia: meta.ocaid ? [meta.ocaid] : [], subjects: meta.subjects};
        lib.set(id, w);
      }
    }catch(e){}
  }
  if(!w) return notFound();
  const ia = iaOf(w);
  const author = w.authors[0] || '';

  view.innerHTML = `<div class="reader">
    <div class="reader-bar">
      <a class="backlink" href="#/book/${w.id}">&larr; Details</a>
      <span class="reader-title">${esc(w.title)}${author ? ` <i>&#10022;</i> ${esc(author)}` : ''}</span>
      ${ia ? `<div class="seg" id="modeSeg">
        <button data-mode="pages" class="${rmode === 'pages' ? 'on' : ''}">&#9661; Pages</button>
        <button data-mode="text"  class="${rmode === 'text'  ? 'on' : ''}">&#9641; Text</button>
      </div>` : ''}
      <div class="reader-tools">
        <button class="tool-btn" id="fMinus" aria-label="Smaller text">A&minus;</button>
        <button class="tool-btn" id="fPlus" aria-label="Larger text">A+</button>
        ${ia ? `<a class="tool-btn" href="${iaPage(w)}" target="_blank" rel="noopener" aria-label="Open at Internet Archive">&#8599;</a>` : ''}
      </div>
    </div>
    <div class="reader-progress"><span id="prog"></span></div>
    <div id="readerStage"></div>
  </div>`;

  document.getElementById('fMinus').onclick = () => { fs = Math.max(15, fs - 1); applyFs(); };
  document.getElementById('fPlus').onclick  = () => { fs = Math.min(26, fs + 1); applyFs(); };
  const seg = document.getElementById('modeSeg');
  if(seg) seg.querySelectorAll('button').forEach(b => {
    b.onclick = () => { rmode = b.dataset.mode; persist('os-rmode', rmode);
      seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); showMode(); };
  });

  const stage = document.getElementById('readerStage');

  if(!ia){
    stage.innerHTML = `<div class="rd-error">
      <h3>No open scan for this work — yet.</h3>
      <p>Open Library catalogues it, but nobody has published a free scan we can stream. You can hunt for one yourself:</p>
      <div class="detail-actions">
        <a class="btn btn-read" target="_blank" rel="noopener" href="${olPage(w)}">Open Library page <span>&#8599;</span></a>
        <a class="btn btn-ghost" target="_blank" rel="noopener" href="https://archive.org/search?query=${encodeURIComponent(w.title)}">Search the Archive &#8599;</a>
      </div></div>`;
    return;
  }

  function showPages(){
    document.getElementById('prog').style.width = '0';
    stage.innerHTML = `
      <iframe class="reader-frame" title="Page reader for ${esc(w.title)}"
        src="https://archive.org/embed/${encodeURIComponent(ia)}"
        allowfullscreen loading="lazy"></iframe>
      <p class="reader-note">PAGE VIEW · scan courtesy of the Internet Archive — scroll to zoom, &#8596; to turn pages</p>`;
  }
  async function showText(){
    stage.innerHTML = `<div class="rd-body" id="rdBody">
      <div class="rd-loading"><div class="spinner"></div><p>Unbinding the scan&hellip;</p></div></div>`;
    applyFs();
    const text = await getText(ia);
    const body = document.getElementById('rdBody');
    if(!body) return; // user switched away mid-fetch
    if(!text){
      body.outerHTML = `<div class="rd-error">
        <h3>The OCR text isn&rsquo;t available for this scan.</h3>
        <p>Some scans only ship page images. The page-flip reader still works beautifully:</p>
        <div class="detail-actions">
          <button class="btn btn-read" id="toPages"><span>&#9664;</span> Switch to Pages view</button>
          <a class="btn btn-ghost" target="_blank" rel="noopener" href="${iaPage(w)}">Archive downloads &#8599;</a>
        </div></div>`;
      const b = document.getElementById('toPages');
      if(b) b.onclick = () => { rmode = 'pages'; persist('os-rmode', rmode);
        document.querySelectorAll('#modeSeg button').forEach(x => x.classList.toggle('on', x.dataset.mode === 'pages')); showPages(); };
      return;
    }
    const blocks = toBlocks(text);
    const capped = blocks.length > 4000;
    body.innerHTML = blocks.slice(0, 4000).map(blockHTML).join('') +
      (capped ? `<h3 class="rd-h">&hellip; continues on the scan at archive.org</h3>` : '');
    if(progHandler) progHandler();
  }
  function showMode(){ rmode === 'pages' ? showPages() : showText(); }

  progHandler = () => {
    if(rmode !== 'text') return;
    const d = document.documentElement;
    const p = d.scrollTop / ((d.scrollHeight - d.clientHeight) || 1);
    const el = document.getElementById('prog');
    if(el) el.style.width = (Math.min(1, Math.max(0, p)) * 100) + '%';
  };
  window.addEventListener('scroll', progHandler, {passive:true});
  showMode();
}

  view.innerHTML = `<div class="search">
    <p class="kicker">DETACHED FROM THE SHELVES · SEARCH THE ENTIRE CATALOGUE</p>
    <h1 class="search-h">Search the stacks.</h1>
    <div class="search-box">
      <span class="search-ico" aria-hidden="true">&#8981;</span>
      <input id="q" type="search" placeholder="Try &ldquo;Dracula&rdquo;, &ldquo;Austen&rdquo;, &ldquo;sherlock&rdquo;, &ldquo;odyssey&rdquo;&hellip;" autocomplete="off">
    </div>
    <p class="search-hint" id="hint">Type at least 2 characters — results stream in live from Open Library. (Tip: press / anywhere.)</p>
    <div id="results"></div>
  </div>`;
  const input = $('#q'); input.focus();
  let timer;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if(q.length < 2){
      $('#hint').textContent = 'Type at least 2 characters — results stream in live from Open Library.';
      $('#results').innerHTML = ''; lastSearch = null;
      if(searchAbort){ searchAbort.abort(); searchAbort = null; }
      return;
    }
    timer = setTimeout(() => doSearch(q), 400);
  });
}
function resultRow(w){
  const cover = coverUrl(w.cover, 'S');
  return `<li><button class="res-item" data-book="${w.id}">
    <span class="res-cover">${cover ? `<img loading="lazy" src="${cover}" alt="" onerror="this.remove()">` : ''}<span class="mini-plate">${esc(initialOf(w.title))}</span></span>
    <span><span class="res-title">${esc(w.title)}</span><span class="res-author">${esc(w.authors[0] || 'Unknown author')}${w.year ? ' · ' + w.year : ''}</span></span>
    <span class="res-shelf">${esc(w.subjects[0] || 'Catalogue')}</span>
    <span class="res-dl">${w.ia.length ? '&#10003; READ' : 'NO SCAN'}</span>
  </button></li>`;
}
async function doSearch(q){
  if(searchAbort) searchAbort.abort();
  const ctrl = new AbortController(); searchAbort = ctrl;
  const res = $('#results'), hint = $('#hint');
  hint.textContent = `Searching for \u201C${q}\u201D\u2026`;
  res.innerHTML = `<div class="res-loading"><div class="spinner sm"></div></div>`;
  try{
    const url = `${OL}/search.json?q=${encodeURIComponent(q)}&limit=${SEARCH_FETCH_LIMIT}` +
      `&fields=key,title,author_name,first_publish_year,cover_i,ia,subject`;
    const data = await olCached(url, j => ({count: j.numFound || 0, results: (j.docs || []).map(fromSearch)}), ctrl.signal);
    data.results.forEach(w => lib.set(w.id, w));
    lastSearch = {results: data.results, count: data.count, q, shown: 0};
    if(!data.results.length){
      hint.textContent = '';
      res.innerHTML = `<div class="empty"><p class="empty-h">Nothing under &ldquo;${esc(q)}&rdquo;.</p>
        <p class="empty-p">Try an author&rsquo;s surname or a shorter title — or browse the shelves from the <a href="#/">home page</a>.</p></div>`;
      return;
    }
    res.innerHTML = `<ul class="res-list" id="resList"></ul>`;
    renderMoreResults();
  }catch(e){
    if(e && e.name === 'AbortError') return;
    res.innerHTML = `<p class="shelf-err">Search failed — Open Library unreachable.</p>`;
  }
}
function renderMoreResults(){
  const s = lastSearch; if(!s) return;
  const batch = s.results.slice(s.shown, s.shown + SEARCH_RENDER_LIMIT);
  s.shown += batch.length;
  $('#resList').insertAdjacentHTML('beforeend', batch.map(resultRow).join(''));
  $('#hint').textContent = `${s.count.toLocaleString()} match${s.count === 1 ? '' : 'es'} for \u201C${s.q}\u201D — showing ${s.shown} of ${s.results.length} fetched.`;
  let wrap = $('#moreWrap');
  if(s.shown < s.results.length){
    if(!wrap){
      $('#results').insertAdjacentHTML('beforeend',
        `<div class="more-wrap" id="moreWrap"><button class="btn btn-ghost" id="moreBtn">Show more results &darr;</button></div>`);
      $('#moreBtn').onclick = renderMoreResults;
    }
  }else if(wrap){ wrap.remove(); }
}

/* ================= router & boot ================= */
function route(){
  if(progHandler){ window.removeEventListener('scroll', progHandler); progHandler = null; }
  window.scrollTo(0, 0);
  const h = (location.hash || '').replace(/^#\/?/, '');
  let m;
  if(m = h.match(/^book\/([A-Za-z0-9_-]+)/)) return renderDetail(m[1]);
  if(m = h.match(/^read\/([A-Za-z0-9_-]+)/)) return renderReader(m[1]);
  if(h === 'search') return renderSearch();
  renderHome();
}
view.addEventListener('click', e => {
  const c = e.target.closest('[data-book]');
  if(c) location.hash = '#/book/' + c.dataset.book;
});
document.addEventListener('keydown', e => {
  if(e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){
    e.preventDefault(); location.hash = '#/search';
  }
});
window.addEventListener('hashchange', route);

$('#mastDate').textContent = new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
buildTicker();
route();
</script>
</body>
</html>
